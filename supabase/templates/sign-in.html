<!doctype html>
<html lang="ko">
  <body style="margin:0;background:#15111f;color:#eeeaf8;font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;background:#221c33;border:2px solid #0d0a14;padding:28px;">
            <tr><td style="font-size:12px;color:#f7b733;letter-spacing:1px;">LIFE RPG</td></tr>
            <tr><td style="padding-top:12px;font-size:20px;font-weight:700;">모험 입장 코드</td></tr>
            <tr><td style="padding-top:8px;font-size:14px;color:#a59cc4;">아래 6자리 코드를 입력하거나 버튼을 눌러 로그인하세요. 코드는 1시간 동안 유효해요.</td></tr>
            <tr>
              <td style="padding-top:20px;">
                <div style="font-size:32px;letter-spacing:8px;font-weight:700;color:#ffd256;background:#0d0a14;padding:14px 0;text-align:center;">{{ .Token }}</div>
              </td>
            </tr>
            <tr>
              <td style="padding-top:20px;" align="center">
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#f7b733;color:#0d0a14;font-weight:700;text-decoration:none;padding:12px 20px;border:2px solid #0d0a14;">모험 시작하기</a>
              </td>
            </tr>
            <tr><td style="padding-top:20px;font-size:12px;color:#a59cc4;">요청하지 않았다면 이 메일을 무시해도 괜찮아요.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
