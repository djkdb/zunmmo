name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · lint · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Local-stack defaults only (public values); production secrets live in Vercel.
      - run: cp .env.example .env.local
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm art:check
      # DB tests skip themselves here — the e2e job runs them against a real stack.
      - run: pnpm test
      - run: pnpm build

  cloudflare:
    name: Cloudflare Workers build (OpenNext)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env.local
      - run: pnpm cf:build
      # Workers limit the gzipped upload: 3 MiB on Free, 10 MiB on Paid (docs/DEPLOY.md §6).
      - name: Worker size
        run: |
          out=$(pnpm exec wrangler deploy --dry-run --outdir .wrangler/dry-run 2>&1)
          kib=$(echo "$out" | sed -n 's/.*gzip: \([0-9.]*\) KiB.*/\1/p')
          echo "Worker gzip size: ${kib} KiB"
          awk -v k="$kib" 'BEGIN { if (k > 3072) print "::warning::Over the Workers Free plan limit (3 MiB): " k " KiB"; exit (k > 10240) }'

  e2e:
    name: DB tests · e2e (production build)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env.local
      - name: Start local Supabase (Postgres, Auth, Mailpit)
        run: pnpm db:start
      - run: pnpm exec playwright install --with-deps chromium
      - name: DB tests (RLS, RPCs, ledger)
        run: pnpm test supabase/tests
      - run: pnpm build
      - name: E2E against next start
        run: pnpm test:e2e
        env:
          E2E_PROD: "1"
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
